# GitHub Pages — validação, QA por navegador e deploy
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Mantém apenas a execução mais recente para evitar filas e deploys obsoletos.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          for file in assets/js/app/*.js; do node --check "$file"; done
          node --check sw.js

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Validate release
        run: node scripts/validate-release.mjs

      - name: Smoke test routes
        run: node scripts/smoke-static.mjs

  e2e-chromium:
    name: E2E Chromium
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — desktop + iPad
        run: npx playwright test --project=desktop-chromium --project=ipad

  e2e-webkit:
    name: E2E WebKit iPhone
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — iPhone WebKit
        run: npx playwright test --project=iphone-webkit

  deploy:
    name: Deploy Pages
    needs: [validate, e2e-chromium, e2e-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-actions:
    name: Cleanup Actions history
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove failed and cancelled workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.conclusion == "cancelled" or .conclusion == "failure") | .id' |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done
