# GitHub Pages — validação, QA por navegador e deploy
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Mantém apenas a execução mais recente para evitar filas e deploys obsoletos.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          for file in assets/js/app/*.js; do node --check "$file"; done
          node --check tests/e2e/app.spec.mjs
          node --check tests/e2e/prancha.spec.mjs
          node --check tests/e2e/nanquim-conceitos.spec.mjs
          node --check tests/e2e/helpers/prancha-mock.mjs
          node --check sw.js

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Validate release
        run: node scripts/validate-release.mjs

      - name: Validate 19 editorial empty states
        run: node scripts/validate-empty-states.mjs

      - name: Smoke test routes
        run: node scripts/smoke-static.mjs

  e2e-desktop:
    name: E2E Desktop
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — Desktop Chromium
        run: npx playwright test --project=desktop-chromium

      - name: Upload visual audit screenshots — Desktop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-smoked-visual-desktop-${{ github.run_id }}
          path: visual-audit/*.png
          if-no-files-found: error
          retention-days: 10

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-desktop-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 10

  e2e-ipad:
    name: E2E iPad
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — iPad
        run: npx playwright test --project=ipad

      - name: Upload visual audit screenshots — iPad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-smoked-visual-ipad-${{ github.run_id }}
          path: visual-audit/*.png
          if-no-files-found: error
          retention-days: 10

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ipad-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 10

  e2e-ipad-webkit:
    name: E2E iPad WebKit
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — iPad WebKit
        run: npx playwright test --project=ipad-webkit

      - name: Upload visual audit screenshots — iPad WebKit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-smoked-visual-ipad-webkit-${{ github.run_id }}
          path: visual-audit/*.png
          if-no-files-found: error
          retention-days: 10

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ipad-webkit-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 10

  e2e-iphone:
    name: E2E iPhone
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — iPhone WebKit
        run: npx playwright test --project=iphone-webkit

      - name: Upload visual audit screenshots — iPhone
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-smoked-visual-iphone-${{ github.run_id }}
          path: visual-audit/*.png
          if-no-files-found: error
          retention-days: 10

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-iphone-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 10

  deploy:
    name: Deploy Pages
    needs: [validate, e2e-desktop, e2e-ipad, e2e-ipad-webkit, e2e-iphone]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '.'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  verify-live:
    name: Verify live Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Confirm public site serves this release
        shell: bash
        run: |
          expected="$(node -p "require('./version.json').version")"
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for attempt in {1..18}; do
            stamp="$(date +%s%N)"
            version_body="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/version.json?t=$stamp" || true)"
            actual="$(printf '%s' "$version_body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})")"
            index_body="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/?t=$stamp" || true)"
            # Confere o CSS efetivamente servido, não apenas o número da versão.
            glass_css="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/assets/css/button-glass-v15-36-15.css?v=$expected&t=$stamp" || true)"
            smoked_css="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/assets/css/black-smoked-uniform-v15-48-163.css?v=$expected&t=$stamp" || true)"
            prancha_css="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/assets/css/design-system/prancha.css?v=$expected&t=$stamp" || true)"
            prancha_js="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/assets/js/app/prancha-ui.js?v=$expected&t=$stamp" || true)"
            type_css="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/assets/css/design-system/nanquim-typography.css?v=$expected&t=$stamp" || true)"
            font_status="$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/fonts/archivo-latin-wght-normal.woff2?t=$stamp" || true)"
            if [ "$actual" = "$expected" ] && [[ "$index_body" == *"app.js?v=$expected"* ]] && [[ "$index_body" == *"black-smoked-uniform-v15-48-163.css?v=$expected"* ]] && [[ "$glass_css" == *"rgba(48,48,50,.88)"* ]] && [[ "$smoked_css" == *"--mm-smoke-card-black:rgba(20,20,21,.94)"* ]] && [[ "$smoked_css" == *"--mm-smoke-tint:0%"* ]] && [[ "$smoked_css" == *"--mm-smoke-card-filter:blur(12px) saturate(105%)"* ]] && [[ "$smoked_css" == *"--mm-ivory-strong:#EEE9E0"* ]] && [[ "$index_body" == *"prancha.css?v=$expected"* ]] && [[ "$index_body" == *"prancha-boot.js?v=$expected"* ]] && [[ "$prancha_css" == *"--pr-oxido:#b8614e"* ]] && [[ "$prancha_js" == *"studyapp.prancha.off"* ]] && [[ "$type_css" == *"archivo-latin-wght-normal.woff2"* ]] && [ "$font_status" = "200" ]; then
              echo "✓ GitHub Pages público está em $actual"
              echo "✓ Black Editorial: vidro fume grafite, tingimento zero e marfim publicados"
              echo "✓ Pranchas: CSS, módulos e interface clássica publicados"
              echo "✓ Conceitos: fontes locais Archivo/Plex/Anton e escala tipográfica publicadas"
              exit 0
            fi
            echo "Tentativa $attempt/18: esperado=$expected publicado=${actual:-indisponível} | html=$( [[ "$index_body" == *"app.js?v=$expected"* ]] && echo ok || echo pendente ) | css=$( [[ "$smoked_css" == *"--mm-smoke-card-black:rgba(20,20,21,.94)"* ]] && echo ok || echo pendente ) | pranchas=$( [[ "$prancha_css" == *"--pr-oxido:#b8614e"* ]] && echo ok || echo pendente )"
            sleep 10
          done
          echo "::error::O GitHub Pages não serviu a versão $expected dentro do prazo."
          exit 1

  cleanup-actions:
    name: Cleanup Actions history
    needs: verify-live
    if: ${{ always() && needs.verify-live.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove failed and cancelled runs older than 10 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '10 days ago' +%s)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "cancelled" or .conclusion == "failure") | [.id, .created_at] | @tsv' |
          while IFS="$(printf '\t')" read -r run_id created_at; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            run_ts="$(date -u -d "$created_at" +%s)"
            [ "$run_ts" -gt "$cutoff" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done
