# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest deployment. Rapid successive pushes should not leave stale Pages runs waiting.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          for file in assets/js/app/*.js; do node --check "$file"; done
          node --check sw.js
      - name: Build search index
        run: node scripts/build-search-index.mjs
      - name: Validate release
        run: node scripts/validate-release.mjs
      - name: Smoke test routes
        run: node scripts/smoke-static.mjs
      - name: Browser E2E
        run: npm run test:e2e
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
