# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe Icons8 SF Black Filled SVG download
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/icons8-probe
          urls=(
            "https://img.icons8.com/sf-black-filled/100/home.svg"
            "https://img.icons8.com/?size=100&id=qBlNlefkEJPq&format=svg&color=000000"
            "https://img.icons8.com/sf-black-filled/100/home.png"
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            curl -L --fail --silent --show-error -D "/tmp/icons8-probe/headers-${n}.txt" "$url" -o "/tmp/icons8-probe/body-${n}" || true
            file "/tmp/icons8-probe/body-${n}" || true
            head -c 200 "/tmp/icons8-probe/body-${n}" || true
            printf '\n' || true
          done
          curl -L --fail --silent --show-error "https://icons8.com/icon/qBlNlefkEJPq/home" -o /tmp/icons8-probe/home-page.html || true
          grep -Eo 'https?[^"'"'"' ]+(svg|png|format=svg)[^"'"'"' ]*' /tmp/icons8-probe/home-page.html | head -100 > /tmp/icons8-probe/urls.txt || true
          cat /tmp/icons8-probe/urls.txt || true
      - name: Upload Icons8 probe
        uses: actions/upload-artifact@v4
        with:
          name: icons8-probe
          path: /tmp/icons8-probe
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
