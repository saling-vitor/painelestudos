# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Icons8 SF Black Filled UI icons
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/icons8-sf-black-filled"
          mkdir -p "$out"
          fetch_icon() {
            key="$1"; shift
            for slug in "$@"; do
              url="https://img.icons8.com/sf-black-filled/100/${slug}.png"
              if curl -L --fail --silent --show-error "$url" -o "$out/${key}.png.tmp"; then
                if file "$out/${key}.png.tmp" | grep -q "PNG image data"; then
                  mv "$out/${key}.png.tmp" "$out/${key}.png"
                  printf '%s\t%s\n' "$key" "$url" >> "$out-sources.tsv"
                  return 0
                fi
              fi
            done
            echo "$key" | tee -a "$out-missing.txt" >&2
            return 1
          }
          fetch_icon home home house || true
          fetch_icon courses books book-shelf bookshelf || true
          fetch_icon maps mind-map flow-chart network || true
          fetch_icon progress combo-chart bar-chart statistics || true
          fetch_icon settings settings gears || true
          fetch_icon search search magnifier magnifying-glass search-more zoom-in search-property || true
          fetch_icon download download downloads || true
          fetch_icon sync synchronize cloud-sync sync refresh available-updates process || true
          fetch_icon plus plus || true
          fetch_icon upload upload || true
          fetch_icon chevron-right chevron-right right || true
          fetch_icon chevron-left chevron-left left || true
          fetch_icon document document file || true
          fetch_icon manage tune sliders settings || true
          fetch_icon star star || true
          fetch_icon grid grid four-squares || true
          fetch_icon list list || true
          fetch_icon close multiply close close-window cancel || true
          fetch_icon trash trash delete || true
          fetch_icon archive archive box || true
          fetch_icon admin toolbox wrench || true
          fetch_icon cloud cloud || true
          fetch_icon user user male-user user-menu-male || true
          fetch_icon warning warning warning-shield error high-priority || true
          fetch_icon success checkmark ok check-mark approval || true
          fetch_icon calendar calendar tear-off-calendar || true
          fetch_icon more more more-details menu-vertical content || true
          fetch_icon device laptop macbook workstation computer || true
          test -f "$out-sources.tsv" && cp "$out-sources.tsv" "$out/_sources.tsv" || true
          test -f "$out-missing.txt" && cp "$out-missing.txt" "$out/_missing.txt" || true
          ls -lah "$out"
      - name: Upload Icons8 SF Black Filled icons
        uses: actions/upload-artifact@v4
        with:
          name: icons8-sf-black-filled
          path: /tmp/icons8-sf-black-filled
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
