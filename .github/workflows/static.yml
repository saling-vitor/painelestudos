# GitHub Pages — validação, QA por navegador e deploy
# V15.54.1: deploy publica só os arquivos do site (_site) e pula pushes só de documentação.
# V15.52: concorrência por branch (um PR não cancela mais o deploy da main), permissões mínimas por job,
# npm ci com lockfile e cache, iPad em 2 partes, auditoria D/T/M + acessibilidade bloqueando o deploy,
# artefatos só em falha e resumo dos testes no painel da execução.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # Mudanças só de documentação não publicam o site (docs/ não é servido pelo Pages).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Testes: um push novo no MESMO PR cancela a execução anterior desse PR. Pushes na main nunca são cancelados.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          node --check assets/js/app.js
          for file in assets/js/*.js assets/js/app/*.js; do node --check "$file"; done
          for file in tests/e2e/*.mjs tests/e2e/helpers/*.mjs scripts/*.mjs; do node --check "$file"; done
          node --check sw.js

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Validate release
        run: node scripts/validate-release.mjs

      - name: Validate 19 editorial empty states
        run: node scripts/validate-empty-states.mjs

      - name: Smoke test routes
        run: node scripts/smoke-static.mjs

      - name: Simulado → map topic matching (informative)
        run: |
          { echo "### Correspondência de tópicos (simulado → mapa)"; echo '```'; node scripts/measure-topic-matching.mjs; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Dead CSS stays at zero
        run: |
          node scripts/css-dead-code.mjs > css-dead.json
          node -e "const r=require('./css-dead.json');if(r.mortas>0){console.error('Declarações CSS mortas: '+r.mortas);process.exit(1)}console.log('✓ Nenhuma declaração CSS sobrescrita sem efeito')"

  e2e:
    name: E2E ${{ matrix.label }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Desktop", project: "desktop-chromium", shard: "1/1" }
          - { label: "iPad 1/2", project: "ipad", shard: "1/2" }
          - { label: "iPad 2/2", project: "ipad", shard: "2/2" }
          - { label: "iPad WebKit", project: "ipad-webkit", shard: "1/1" }
          - { label: "iPhone", project: "iphone-webkit", shard: "1/1" }
          - { label: "Auditoria D/T/M e acessibilidade", project: "auditoria-plataformas", shard: "1/1" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Browser E2E — ${{ matrix.label }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }} --reporter=list,json

      - name: Test summary
        if: always()
        run: node scripts/ci-summary.mjs playwright-results.json "${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            visual-audit/*.png
          if-no-files-found: ignore
          retention-days: 5

  visual-compare:
    name: Comparação visual com a main (informativa)
    if: ${{ github.event_name == 'pull_request' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          path: pr

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: base

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Snapshot main and PR
        env:
          AUDIT_SNAP: D-1440x900,T-820x1180,M-390x844
        run: |
          for side in base pr; do
            (cd "$side" && node scripts/prepare-release.mjs && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund) && node scripts/build-search-index.mjs \
              && cp ../pr/tests/e2e/auditoria-plataformas.spec.mjs tests/e2e/auditoria-plataformas.spec.mjs \
              && AUDIT_OUT="$GITHUB_WORKSPACE/snap-$side" npx playwright test --project=auditoria-plataformas -g "D-1440x900 · prancha|T-820x1180 · prancha|M-390x844 · prancha" --reporter=line) || true
          done

      - name: Compare computed styles
        run: node pr/scripts/compare-style-snapshots.mjs snap-base snap-pr >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: comparacao-visual-${{ github.run_id }}
          path: |
            snap-base/shots/
            snap-pr/shots/
          if-no-files-found: ignore
          retention-days: 5

  deploy:
    name: Deploy Pages
    needs: [validate, e2e]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # Publicação: nunca cancelada; pushes seguidos publicam em ordem.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Build search index
        run: node scripts/build-search-index.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publica só o que o site usa: fora ficam docs, testes, scripts e arquivos de desenvolvimento.
      - name: Stage public files
        run: |
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='docs/' --exclude='tests/' --exclude='scripts/' \
            --exclude='test-results/' --exclude='playwright-report/' --exclude='visual-audit/' \
            --exclude='package.json' --exclude='package-lock.json' --exclude='playwright.config.mjs' \
            --exclude='css-dead.json' --exclude='_site/' \
            ./ _site/
          echo "Artefato do Pages: $(du -sh _site | cut -f1) (repositório: $(du -sh --exclude=.git . | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: '_site'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  verify-live:
    name: Verify live Pages
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare automatic release version
        run: node scripts/prepare-release.mjs

      - name: Confirm public site serves this release, byte by byte
        shell: bash
        run: |
          expected="$(node -p "require('./version.json').version")"
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          # Arquivos conferidos por SHA-256 contra o build desta execução (mesmo prepare-release).
          files="index.html sw.js reader.html offline.html version.json assets/css/design-system/prancha.css assets/css/camada-5-acabamento-final.css assets/js/app/prancha-ui.js assets/js/app/state.js assets/js/app/updates.js data/catalog.json"
          for attempt in {1..18}; do
            stamp="$(date +%s%N)"; ok=1; report=""
            for f in $files; do
              want="$(sha256sum "$f" | cut -d' ' -f1)"
              got="$(curl -fsSL -H 'Cache-Control: no-cache' "$base/$f?t=$stamp" | sha256sum | cut -d' ' -f1 || true)"
              if [ "$want" = "$got" ]; then report="$report ok:$f"; else ok=0; report="$report pendente:$f"; fi
            done
            font_status="$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/fonts/archivo-latin-wght-normal.woff2?t=$stamp" || true)"
            if [ "$ok" = "1" ] && [ "$font_status" = "200" ]; then
              echo "✓ GitHub Pages público está em $expected, com os arquivos idênticos ao build"
              { echo "### Site publicado"; echo "Versão $expected · arquivos conferidos por SHA-256:"; for f in $files; do echo "- \`$f\`"; done; } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Tentativa $attempt/18 ($expected):$report fonte=$font_status"
            sleep 10
          done
          echo "::error::O GitHub Pages não serviu a versão $expected idêntica ao build dentro do prazo."
          exit 1

  cleanup-actions:
    name: Cleanup Actions history
    needs: verify-live
    if: ${{ always() && needs.verify-live.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove failed and cancelled runs older than 10 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '10 days ago' +%s)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "cancelled" or .conclusion == "failure") | [.id, .created_at] | @tsv' |
          while IFS="$(printf '\t')" read -r run_id created_at; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            run_ts="$(date -u -d "$created_at" +%s)"
            [ "$run_ts" -gt "$cutoff" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || true
          done
