name: Import Lote 01 assets from Drive (temporary)

on:
  push:
    branches:
      - work/lote-01-topographic-editorial-20261008

permissions:
  contents: write

jobs:
  import-assets:
    name: Transfer verified Drive assets to work branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/work/lote-01-topographic-editorial-20261008'
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safe Google Drive downloader
        run: python -m pip install --quiet gdown==5.2.0
      - name: Download and validate exactly 48 Drive assets
        run: python scripts/import-lote01-drive-assets.py
      - name: Commit verified assets to work branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/brand/topographic-editorial-v1/
          if ! git diff --cached --quiet; then
            git commit -m "assets(lote-01): importar kit Topographic Editorial completo e conferido do Drive"
            git push origin HEAD:work/lote-01-topographic-editorial-20261008
          else
            echo "48 assets already present and verified."
          fi
