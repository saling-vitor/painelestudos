<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="application-name" content="Meus Mapas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meus Mapas">
<link rel="manifest" href="manifest-v15.23.6.webmanifest?v=15.48.174">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/topographic-editorial-v1/icons/apple-touch-icon.png">
<link rel="icon" type="image/x-icon" href="assets/brand/topographic-editorial-v1/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/topographic-editorial-v1/icons/favicon-32.png">
<title>Meus Mapas · Abrindo mapa</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000000;color:#ece6da;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.loading{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;background:#000000}
.loading-cover{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(16px) brightness(.18) saturate(.65);opacity:.38}
.loading-shade{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(10,12,16,.25),rgba(2,3,4,.94))}
.loading-card{position:relative;z-index:2;width:min(430px,90vw);padding:22px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:#0a0a09;-webkit-backdrop-filter:none;backdrop-filter:none;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.48)}
.loading-code{display:block;color:#d8c59e;font:800 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.loading-card b{display:block;margin-top:8px;color:#ece6da;font-size:15px}
.loading-card>span:not(.loading-code){display:block;margin-top:8px;color:#b9b2a5;font-size:12px;line-height:1.55}
.loading-line{height:2px;margin-top:17px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.07)}
.loading-line span{display:block;width:35%;height:100%;background:#d8c59e;animation:reader-loading-line 1.25s ease-in-out infinite}
@keyframes reader-loading-line{from{transform:translateX(-110%)}to{transform:translateX(310%)}}
@media(prefers-reduced-motion:reduce){.loading-line span{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="loading"><img id="loadingCover" class="loading-cover" alt="" hidden><div class="loading-shade"></div><div class="loading-card"><span class="loading-code" id="loadingCode"></span><b id="loadingTitle">Abrindo mapa</b><span id="status">Preparando o documento…</span><div class="loading-line"><span></span></div></div></div>
<script src="assets/js/config.js?v=12.7"></script>
<script src="assets/js/cloud-core.js?v=13.1.15"></script><script src="assets/js/map-cloud-bridge.js?v=15.0.0"></script>
<script>
(()=>{'use strict';
const status=document.getElementById('status');
const p=new URLSearchParams(location.search);
const mode=p.get('mode')||'local';
const path=p.get('path')||'';
const href=p.get('href')||'';
const title=p.get('title')||'';
const code=p.get('code')||'';
const cover=p.get('cover')||'';
const topic=p.get('topic')||'';
const titleEl=document.getElementById('loadingTitle');
const codeEl=document.getElementById('loadingCode');
const coverEl=document.getElementById('loadingCover');
if(title&&titleEl)titleEl.textContent=title;
if(code&&codeEl)codeEl.textContent=code;
if(cover&&coverEl){coverEl.src=cover;coverEl.hidden=false;coverEl.addEventListener('error',()=>{coverEl.hidden=true},{once:true})}
const slug=v=>String(v||'').trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const attr=(tag,name)=>{const q=new RegExp('\\b'+name+'\\s*=\\s*(["\\\'])(.*?)\\1','i').exec(tag);if(q)return q[2];const u=new RegExp('\\b'+name+'\\s*=\\s*([^\\s>]+)','i').exec(tag);return u?u[1]:''};
const meta=(html,name)=>{const tags=String(html).match(/<meta\b[^>]*>/gi)||[];for(const tag of tags){if(String(attr(tag,'name')).toLowerCase()===String(name).toLowerCase())return attr(tag,'content')}return''};
const stripAppBridge=html=>String(html).replace(/<script\s+src=["'](?:\.\.\/)*assets\/js\/(?:config|cloud-core|map-cloud-bridge)\.js(?:\?[^"']*)?["']><\/script>\s*/gi,'');
const readerEnhancement=target=>{const safe=JSON.stringify(String(target||''));return `<style id="study-reader-enhancement-style">.study-reader-toolbar{transition:padding .18s ease,opacity .18s ease,transform .18s ease}.study-reader-toolbar.study-reader-toolbar-compact{padding-top:4px!important;padding-bottom:4px!important;gap:4px!important;opacity:.97}.study-reader-toolbar.study-reader-toolbar-compact button,.study-reader-toolbar.study-reader-toolbar-compact a[role="button"],.study-reader-toolbar.study-reader-toolbar-compact [role="button"]{min-height:40px!important;padding-top:4px!important;padding-bottom:4px!important;font-size:14px!important}.study-reader-toolbar.study-reader-toolbar-compact input,.study-reader-toolbar.study-reader-toolbar-compact select{min-height:40px!important;font-size:16px!important}.study-reader-topic-target{outline:2px solid rgba(216,197,158,.55)!important;outline-offset:5px!important;border-radius:8px}</style><script>(()=>{'use strict';document.documentElement.dataset.readerEnhanced='1';const target=${safe};const candidates=()=>{const selectors=['[data-study-toolbar]','.study-toolbar','.toolbar','.study-actions','.study-controls','.top-controls','.controls'];const nodes=[];for(const selector of selectors)document.querySelectorAll(selector).forEach(node=>{if(!nodes.includes(node))nodes.push(node)});return nodes};const findToolbar=()=>candidates().find(node=>/Busca|Expandir|Recolher|Alta incid|Véspera|Fila|Estudo/i.test(node.textContent||'')&&node.querySelector('button,input,select,[role="button"]'))||null;const revealTopic=()=>{if(!target)return;let node=null;try{node=document.querySelector('[data-topic-id="'+CSS.escape(target)+'"]')}catch{}if(!node)return;const details=node.matches('details')?node:node.closest('details');if(details)details.open=true;node.classList.add('study-reader-topic-target');setTimeout(()=>node.scrollIntoView({behavior:'smooth',block:'start'}),120);setTimeout(()=>node.classList.remove('study-reader-topic-target'),2600)};const init=()=>{const toolbar=findToolbar();if(toolbar){toolbar.classList.add('study-reader-toolbar');let lastY=window.scrollY||document.documentElement.scrollTop||0,ticking=false;const update=()=>{const y=window.scrollY||document.documentElement.scrollTop||0;if(y>120&&y>lastY+1)toolbar.classList.add('study-reader-toolbar-compact');else if(y<80||y<lastY-7)toolbar.classList.remove('study-reader-toolbar-compact');lastY=y;ticking=false};addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});toolbar.addEventListener('pointerenter',()=>toolbar.classList.remove('study-reader-toolbar-compact'));toolbar.addEventListener('focusin',()=>toolbar.classList.remove('study-reader-toolbar-compact'))}revealTopic()};if(document.readyState==='loading')addEventListener('DOMContentLoaded',init,{once:true});else setTimeout(init,0)})();<\/script>`};
const mmNanquimReaderStyle="<style id=\"mm-nanquim-reader-theme\">/* V15.48.174-G · estilo injetado pelo reader, sem alterar conteúdo de mapas */\n:root{color-scheme:dark;--nq-nanquim:#000;--nq-grafite-0:#050505;--nq-grafite-1:#0a0a09;--nq-grafite-2:#111110;--nq-linha:#242320;--nq-papel:#ece6da;--nq-papel-2:#b9b2a5;--nq-papel-3:#857e72;--nq-latao:#c3aa84;--nq-oxido:#b8614e;--nq-musgo:#8c9a6c;--nq-sans:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif;--nq-mono:\"JetBrains Mono\",ui-monospace,monospace;--fs-display:3.5rem;--fs-h1:2rem;--fs-h2:1.5rem;--fs-h3:1.125rem;--fs-title:1rem;--fs-body:.9375rem;--fs-body-sm:.875rem;--fs-label:.875rem;--fs-input:.9375rem;--fs-caption:.75rem;--fs-eyebrow:.6875rem;--fs-tabbar:.75rem;--fs-kpi:2rem;--fs-kpi-sm:1.25rem;--bg:#000;--surface:#050505;--surface2:#0a0a09;--surface3:#111110;--text:#ece6da;--text2:#b9b2a5;--muted:#857e72;--muted2:#857e72;--sans:var(--nq-sans);--mono:var(--nq-mono)}\n@media(min-width:701px) and (max-width:1180px){:root{--fs-display:2.75rem;--fs-h1:1.875rem;--fs-h2:1.375rem;--fs-body:1rem;--fs-label:.9375rem;--fs-input:1rem;--fs-caption:.8125rem;--fs-kpi:1.875rem}}\n@media(max-width:700px){:root{--fs-display:2rem;--fs-h1:1.625rem;--fs-h2:1.25rem;--fs-h3:1.0625rem;--fs-body:1rem;--fs-label:.9375rem;--fs-input:1rem;--fs-caption:.8125rem;--fs-kpi:1.75rem;--fs-kpi-sm:1.125rem}}\nhtml,body{background-color:var(--nq-nanquim)!important;color:var(--nq-papel);font-family:var(--nq-sans)!important}\n:is(.mindmap-app,.page-shell,.ramo,.mindmap){font-family:var(--nq-sans)!important}\n:is(.branch-card,.topic-card,.review-box,.branch-memo){background-color:var(--nq-grafite-1)!important;border-color:var(--nq-linha)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}\n:is(.hero-title){font-family:var(--nq-sans)!important;font-size:var(--fs-display)!important;line-height:1.04!important}\n:is(.ramo-title,.section-title){font-size:var(--fs-h2)!important}\n:is(.branch-title,.topic-heading,.topic-name){font-size:var(--fs-h3)!important}\n:is(.topic-body,.study-block,.ramo-desc,.branch-desc){font-size:var(--fs-body)!important;line-height:1.55}\n:is(.tool-btn,.legend-btn,.branch-action,.mi-btn){font-size:var(--fs-label)!important}\n:is(.topic-code,.branch-meta,.topic-source-label,.eyebrow){font-size:var(--fs-caption)!important}\n:is(input,select,textarea,.search-wrap input){font-size:var(--fs-input)!important}\n@media(max-width:1180px){:is(input,select,textarea,.search-wrap input){font-size:1rem!important;min-height:40px}}\n:is(.toolbar-dock,.study-reader-toolbar:not(.toolbar-dock .study-reader-toolbar)){background:radial-gradient(120% 80% at 18% -10%,rgba(216,197,158,.07),transparent 60%),rgba(5,5,5,.78)!important;-webkit-backdrop-filter:blur(22px) saturate(140%)!important;backdrop-filter:blur(22px) saturate(140%)!important;border-color:rgba(236,226,208,.08)!important}\n.toolbar-dock .toolbar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}\n:is(.tool-btn,.branch-action,.mi-btn):focus-visible{outline:2px solid #d8c59e!important;outline-offset:2px}\n@media(prefers-reduced-transparency:reduce),(prefers-contrast:more){:is(.toolbar-dock,.study-reader-toolbar){background:#0b0a09!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}\n@media(prefers-reduced-motion:reduce){:is(.toolbar-dock,.study-reader-toolbar,.tool-btn){animation:none!important;transition:none!important}}\n</style>";
const enhanceHtml=html=>{const patch=readerEnhancement(topic)+(html.includes('id="mm-nanquim-map-theme"')?'':mmNanquimReaderStyle);return /<\/body>/i.test(html)?html.replace(/<\/body>/i,patch+'</body>'):html+patch};
async function loadBundledHtml(href){
 const absoluteUrl=new URL(href,location.href).href;

 /*
  * OFFLINE:
  * consultar diretamente o Cache Storage.
  *
  * Não fazer tentativa de rede antes.
  */
 if(navigator.onLine===false&&'caches' in window){
   try{
     const hit=await caches.match(absoluteUrl,{ignoreSearch:true});
     if(hit){
       status.textContent='Abrindo mapa salvo neste aparelho…';
       return await hit.text();
     }
   }catch(_){}

   throw new Error('Este mapa não está disponível offline neste aparelho.');
 }

 /*
  * ONLINE ou fallback.
  */
 const r=await fetch(href);
 if(!r.ok)throw new Error('Não foi possível carregar o mapa ('+r.status+').');
 return await r.text();
}
async function load(){
 try{
   let html='';
   status.textContent=mode==='cloud'?'Baixando o mapa privado da nuvem…':'Carregando o mapa do aplicativo…';
   if(mode==='cloud'){
     if(!window.StudyCloud?.configured()||!StudyCloud.session())throw new Error('Sessão da nuvem não encontrada neste aparelho.');
     if(!path)throw new Error('Caminho do mapa não informado.');
     html=await StudyCloud.downloadCached(path);
   }else{
     if(!href)throw new Error('Arquivo do mapa não informado.');
     status.textContent=navigator.onLine===false
       ?'Abrindo mapa salvo neste aparelho…'
       :'Carregando mapa do aplicativo…';
     html=await loadBundledHtml(href);
   }
   const storageId=slug(meta(html,'mindmap-storage-id'));
   if(storageId&&window.StudyCloud?.configured()&&StudyCloud.session()){
     status.textContent='Restaurando progresso e notas…';
     await Promise.all([
       StudyCloud.restoreStorageKey('mindmap_state::'+storageId).catch(()=>false),
       StudyCloud.restoreStorageKey('mindmap_notes::'+storageId).catch(()=>false)
     ]);
   }
   status.textContent='Iniciando o mapa…';
   html=stripAppBridge(html);
   html=enhanceHtml(html);
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   document.body.innerHTML='<div class="loading"><div class="loading-shade"></div><div class="loading-card"><b>Falha ao abrir mapa</b><span>'+String(e?.message||e).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span><button type="button" onclick="location.reload()" style="margin-top:8px;min-height:36px;padding:0 14px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:#15181d;color:#e5e6e8;font:700 11px system-ui;cursor:pointer">Tentar novamente</button></div></div>';
 }
}
load();
})();
</script>
</body>
</html>
